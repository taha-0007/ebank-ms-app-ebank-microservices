server.port=8058
spring.application.name=ebank-bot

# Configuration OpenAI
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model=gpt-4o

# Configuration Eureka (optionnel pour l'instant)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Désactiver la vérification du Config Server pour ce module
spring.cloud.config.enabled=false
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8056/mcp
spring.ai.mcp.client.streamable-http.connections.ebank-service.url=http://localhost:8057/mcp